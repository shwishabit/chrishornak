  <circle cx="46" cy="122" r="3" fill="#2dd4a8" opacity="0.3"/>
  <text x="56" y="125" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#555555" letter-spacing="4">marketing strategist</text>
