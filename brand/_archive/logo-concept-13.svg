<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="c13grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8572a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="200" fill="#0a0a0a"/>

  <!-- Mark: Folded planes — depth, perspective, dimension -->
  <g transform="translate(30, 40)">
    <!-- Back plane — darkest -->
    <polygon points="45,0 100,25 100,95 45,120" fill="#161616" stroke="#222222" stroke-width="1"/>
    <!-- Middle plane -->
    <polygon points="25,15 80,40 80,110 25,85" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
    <!-- Front plane — accent edge -->
    <polygon points="5,30 60,55 60,100 5,75" fill="#111111" stroke="url(#c13grad)" stroke-width="1.5"/>
  </g>

  <!-- Full name -->
  <text x="150" y="105" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#f0f0f0" letter-spacing="2">CHRIS HORNAK</text>

  <!-- Descriptor -->
  <text x="150" y="132" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#555555" letter-spacing="5">GROWTH STRATEGIST</text>
</svg>