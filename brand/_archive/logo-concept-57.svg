<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 170" width="660" height="170">
  <rect width="660" height="170" fill="#0a0a0a"/>

  <!-- Wordmark with dotless i -->
  <text x="35" y="105" font-family="'Sora', 'Helvetica Neue', sans-serif" font-size="60" font-weight="700" fill="#f0f0f0" letter-spacing="-1">chrıs hornak</text>

  <!-- Ghost trail: motion lines (from 49 style) trailing lower-left -->
  <line x1="124" y1="60" x2="130" y2="54" stroke="#2dd4a8" stroke-width="2" stroke-linecap="round" opacity="0.15"/>
  <line x1="128" y1="56" x2="134" y2="48" stroke="#2dd4a8" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Main dot — directly above the i -->
  <circle cx="137" cy="44" r="6" fill="#2dd4a8"/>

  <!-- Accent bar mirrors the motion lines — short bar at same angle -->
  <line x1="35" y1="124" x2="62" y2="118" stroke="#2dd4a8" stroke-width="4" stroke-linecap="round"/>
  <text x="70" y="122" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#555555" letter-spacing="4">marketing strategist</text>
</svg>