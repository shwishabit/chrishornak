<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="c11grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8572a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="200" fill="#0a0a0a"/>

  <!-- Mark: Stacked chevrons — momentum, layers of strategy -->
  <g transform="translate(40, 45)">
    <!-- Bottom chevron — darkest -->
    <polyline points="0,90 45,60 90,90" stroke="#252525" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Middle chevron -->
    <polyline points="0,68 45,38 90,68" stroke="#555555" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top chevron — accent -->
    <polyline points="0,46 45,16 90,46" stroke="url(#c11grad)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Full name -->
  <text x="165" y="105" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#f0f0f0" letter-spacing="2">CHRIS HORNAK</text>

  <!-- Descriptor -->
  <text x="165" y="132" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#555555" letter-spacing="5">GROWTH STRATEGIST</text>
</svg>