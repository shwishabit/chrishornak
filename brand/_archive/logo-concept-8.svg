<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="c8grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8572a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="200" fill="#0a0a0a"/>

  <!-- Constellation mark — tighter, more intentional cluster -->
  <g transform="translate(30, 55)">
    <circle cx="8" cy="70" r="3" fill="#1e1e1e"/>
    <circle cx="22" cy="52" r="4" fill="#2a2a2a"/>
    <circle cx="15" cy="30" r="3" fill="#333333"/>
    <circle cx="40" cy="58" r="5" fill="#444444"/>
    <circle cx="38" cy="35" r="4" fill="#555555"/>
    <circle cx="58" cy="42" r="6" fill="#777777"/>
    <circle cx="55" cy="18" r="4" fill="#999999"/>
    <circle cx="78" cy="24" r="7" fill="#bbbbbb"/>
    <circle cx="100" cy="8" r="9" fill="url(#c8grad)"/>
    <!-- Connections — sparse, not every dot -->
    <line x1="22" y1="52" x2="40" y2="58" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="40" y1="58" x2="58" y2="42" stroke="#1e1e1e" stroke-width="0.8"/>
    <line x1="58" y1="42" x2="78" y2="24" stroke="#252525" stroke-width="0.8"/>
    <line x1="78" y1="24" x2="100" y2="8" stroke="#333333" stroke-width="0.8"/>
  </g>

  <!-- Full name — single line, equal treatment -->
  <text x="165" y="105" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#f0f0f0" letter-spacing="2">CHRIS HORNAK</text>

  <!-- Descriptor -->
  <text x="165" y="132" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#555555" letter-spacing="5">GROWTH STRATEGIST</text>
</svg>