<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8572a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="600" height="200" fill="#0a0a0a"/>

  <!-- Abstract mark: Three ascending bars forming a subtle H -->
  <g transform="translate(40, 35)">
    <!-- Left bar (shorter) -->
    <rect x="0" y="50" width="14" height="80" rx="3" fill="#333333"/>
    <!-- Center bar (medium, connects like H crossbar) -->
    <rect x="24" y="28" width="14" height="102" rx="3" fill="#555555"/>
    <!-- Right bar (tallest — growth) -->
    <rect x="48" y="0" width="14" height="130" rx="3" fill="url(#markGrad)"/>
  </g>

  <!-- Name -->
  <text x="130" y="95" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-size="48" font-weight="700" fill="#f0f0f0" letter-spacing="2">HORNAK</text>

  <!-- Divider line -->
  <line x1="130" y1="108" x2="420" y2="108" stroke="#222222" stroke-width="1"/>

  <!-- Descriptor -->
  <text x="130" y="130" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" fill="#666666" letter-spacing="5">GROWTH STRATEGIST</text>
</svg>