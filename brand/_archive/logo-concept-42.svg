<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 170" width="660" height="170">
  <rect width="660" height="170" fill="#0a0a0a"/>

  <!-- Full wordmark -->
  <text x="35" y="105" font-family="'Sora', 'Helvetica Neue', sans-serif" font-size="60" font-weight="700" fill="#f0f0f0" letter-spacing="-1">chr</text>
  <text x="130" y="105" font-family="'Sora', 'Helvetica Neue', sans-serif" font-size="60" font-weight="700" fill="#f0f0f0" letter-spacing="-1">i</text>
  <text x="145" y="105" font-family="'Sora', 'Helvetica Neue', sans-serif" font-size="60" font-weight="700" fill="#f0f0f0" letter-spacing="-1">s hornak</text>

  <!-- Hide default i dot -->
  <rect x="128" y="48" width="18" height="16" fill="#0a0a0a"/>

  <!-- Dot with two small motion lines beside it — clean, minimal movement indicator -->
  <circle cx="137" cy="42" r="6" fill="#e8572a"/>
  <!-- Two short angled lines to the lower-left of the dot — implying it just moved up-right -->
  <line x1="127" y1="56" x2="131" y2="52" stroke="#e8572a" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="124" y1="52" x2="128" y2="48" stroke="#e8572a" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

  <!-- Accent bar + descriptor -->
  <rect x="35" y="120" width="30" height="4" rx="2" fill="#e8572a"/>
  <text x="73" y="124" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#555555" letter-spacing="4">marketing strategist</text>
</svg>