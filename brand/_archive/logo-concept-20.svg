<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <linearGradient id="c20grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8572a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="180" fill="#0a0a0a"/>

  <!-- Mark: The Slash — bold diagonal cut. Decisive. Action. -->
  <g transform="translate(45, 25)">
    <!-- Ghost slash for depth -->
    <line x1="60" y1="0" x2="15" y2="130" stroke="#161616" stroke-width="18" stroke-linecap="round"/>
    <!-- Main slash -->
    <line x1="55" y1="0" x2="10" y2="130" stroke="url(#c20grad)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Full name -->
  <text x="130" y="100" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#f0f0f0" letter-spacing="2">CHRIS HORNAK</text>
</svg>