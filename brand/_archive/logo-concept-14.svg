<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="c14grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8572a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="200" fill="#0a0a0a"/>

  <!-- Mark: Signal waves — broadcasting, influence, reach -->
  <g transform="translate(60, 100)">
    <!-- Core pulse -->
    <circle cx="0" cy="0" r="5" fill="url(#c14grad)"/>
    <!-- Wave 1 — tight -->
    <path d="M 18,-22 A 28,28 0 0,1 18,22" stroke="#555555" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Wave 2 -->
    <path d="M 32,-36 A 48,48 0 0,1 32,36" stroke="#3a3a3a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Wave 3 — widest, faintest -->
    <path d="M 46,-48 A 66,66 0 0,1 46,48" stroke="#252525" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Full name -->
  <text x="165" y="105" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#f0f0f0" letter-spacing="2">CHRIS HORNAK</text>

  <!-- Descriptor -->
  <text x="165" y="132" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#555555" letter-spacing="5">GROWTH STRATEGIST</text>
</svg>