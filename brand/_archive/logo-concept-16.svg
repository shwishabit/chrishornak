<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <linearGradient id="c16grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#e8572a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="180" fill="#0a0a0a"/>

  <!-- Single bold chevron — minimal, one stroke, unmistakable -->
  <g transform="translate(35, 38)">
    <!-- Shadow chevron for depth -->
    <polyline points="8,78 48,40 88,78" stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Main chevron -->
    <polyline points="5,75 45,37 85,75" stroke="url(#c16grad)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Full name -->
  <text x="145" y="100" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#f0f0f0" letter-spacing="2">CHRIS HORNAK</text>
</svg>