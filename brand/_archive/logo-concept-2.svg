<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8572a;stop-opacity:0" />
      <stop offset="40%" style="stop-color:#e8572a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="600" height="200" fill="#0a0a0a"/>

  <!-- Clean typographic approach: CHRIS HORNAK stacked -->
  <text x="40" y="78" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-size="18" font-weight="300" fill="#666666" letter-spacing="10">CHRIS</text>

  <text x="40" y="128" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-size="56" font-weight="800" fill="#f0f0f0" letter-spacing="2">HORNAK</text>

  <!-- Ascending growth line — organic curve, not a chart -->
  <path d="M 40 145 C 120 145, 200 140, 320 125 S 450 95, 560 60"
        stroke="url(#lineGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Small dot at the end of the growth line -->
  <circle cx="560" cy="60" r="4" fill="#ff8c42"/>

  <!-- Descriptor -->
  <text x="40" y="170" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#555555" letter-spacing="5">GROWTH STRATEGIST</text>
</svg>