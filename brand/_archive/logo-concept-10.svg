<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220">
  <defs>
    <linearGradient id="c10grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8572a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="c10glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="700" height="220" fill="#0a0a0a"/>

  <!-- Constellation mark — centered above the name, acts as a crown/north star -->
  <g transform="translate(260, 15)">
    <!-- Outer scattered dots -->
    <circle cx="10" cy="65" r="2.5" fill="#1a1a1a"/>
    <circle cx="35" cy="72" r="3" fill="#222222"/>
    <circle cx="55" cy="55" r="3.5" fill="#333333"/>
    <circle cx="80" cy="62" r="3" fill="#2a2a2a"/>
    <circle cx="105" cy="48" r="4" fill="#444444"/>
    <circle cx="130" cy="55" r="3" fill="#333333"/>
    <circle cx="155" cy="68" r="2.5" fill="#222222"/>
    <circle cx="170" cy="58" r="3" fill="#1e1e1e"/>

    <!-- Inner cluster — brighter, tighter -->
    <circle cx="65" cy="38" r="4" fill="#666666"/>
    <circle cx="90" cy="30" r="5" fill="#999999"/>
    <circle cx="115" cy="35" r="4.5" fill="#777777"/>

    <!-- North star — the focal point -->
    <circle cx="90" cy="10" r="7" fill="url(#c10grad)"/>
    <circle cx="90" cy="10" r="22" fill="url(#c10glow)"/>

    <!-- Sparse connections -->
    <line x1="55" y1="55" x2="65" y2="38" stroke="#1a1a1a" stroke-width="0.6"/>
    <line x1="65" y1="38" x2="90" y2="30" stroke="#222222" stroke-width="0.6"/>
    <line x1="90" y1="30" x2="90" y2="10" stroke="#333333" stroke-width="0.7"/>
    <line x1="90" y1="30" x2="115" y2="35" stroke="#222222" stroke-width="0.6"/>
    <line x1="105" y1="48" x2="90" y2="30" stroke="#1e1e1e" stroke-width="0.6"/>
  </g>

  <!-- Full name — centered, mixed case, confident -->
  <text x="350" y="145" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-size="46" font-weight="700" fill="#f0f0f0" letter-spacing="2" text-anchor="middle">Chris Hornak</text>

  <!-- Thin accent line -->
  <line x1="230" y1="160" x2="470" y2="160" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Descriptor — centered -->
  <text x="350" y="182" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#555555" letter-spacing="6" text-anchor="middle">GROWTH STRATEGIST</text>
</svg>