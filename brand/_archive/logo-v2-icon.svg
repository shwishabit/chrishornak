<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="40" fill="#0a0a0a"/>

  <!-- The mark standalone: dot + ghost trail moving up-right -->
  <!-- Designed to read at 40px -->

  <!-- Trail dot 1 — origin -->
  <circle cx="70" cy="130" r="10" fill="#2dd4a8" opacity="0.2"/>
  <!-- Trail dot 2 — mid -->
  <circle cx="88" cy="108" r="15" fill="#2dd4a8" opacity="0.4"/>
  <!-- Main dot — destination -->
  <circle cx="110" cy="80" r="22" fill="#2dd4a8"/>
</svg>