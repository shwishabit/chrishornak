<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <linearGradient id="c18grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8572a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="180" fill="#0a0a0a"/>

  <!-- Orbital arcs — NOT concentric/bullseye. Offset, asymmetric, like a slingshot trajectory -->
  <g transform="translate(55, 90)">
    <!-- Arc 1 — wide sweep, faint -->
    <path d="M -45,30 A 60,45 -15 0,1 35,-40" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arc 2 — tighter, brighter -->
    <path d="M -25,22 A 38,30 -10 0,1 28,-28" stroke="#444444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Arc 3 — tightest, accent -->
    <path d="M -8,12 A 18,16 -5 0,1 18,-14" stroke="url(#c18grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- No center dot — open, not a target -->
  </g>

  <!-- Full name -->
  <text x="150" y="100" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#f0f0f0" letter-spacing="2">CHRIS HORNAK</text>
</svg>