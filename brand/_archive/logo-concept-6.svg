<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8572a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="200" fill="#0a0a0a"/>

  <!-- Stamp/seal mark: circle with H cut out via negative space -->
  <g transform="translate(40, 20)">
    <!-- Outer ring -->
    <circle cx="80" cy="80" r="70" stroke="url(#ringGrad)" stroke-width="3" fill="none"/>
    <!-- Inner H — minimal, geometric, centered in circle -->
    <line x1="55" y1="50" x2="55" y2="110" stroke="#f0f0f0" stroke-width="5" stroke-linecap="round"/>
    <line x1="105" y1="50" x2="105" y2="110" stroke="#f0f0f0" stroke-width="5" stroke-linecap="round"/>
    <line x1="55" y1="80" x2="105" y2="80" stroke="#f0f0f0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Name — horizontal, clean -->
  <text x="210" y="88" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#f0f0f0" letter-spacing="4">HORNAK</text>

  <!-- Descriptor -->
  <text x="210" y="118" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#555555" letter-spacing="5">GROWTH STRATEGIST</text>
</svg>