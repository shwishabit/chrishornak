<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 170" width="660" height="170">
  <rect width="660" height="170" fill="#0a0a0a"/>

  <!-- Wordmark with dotless i -->
  <text x="35" y="105" font-family="'Sora', 'Helvetica Neue', sans-serif" font-size="60" font-weight="700" fill="#f0f0f0" letter-spacing="-1">chrıs hornak</text>

  <!-- Ghost trail: two dots trailing from lower-left toward the i dot position -->
  <circle cx="127" cy="58" r="3" fill="#2dd4a8" opacity="0.15"/>
  <circle cx="132" cy="52" r="4.5" fill="#2dd4a8" opacity="0.3"/>

  <!-- Main dot — directly above the i stem, slightly lifted -->
  <circle cx="137" cy="44" r="6" fill="#2dd4a8"/>

  <!-- Accent bar — same trajectory angle as the dot trail, tilted up-right -->
  <rect x="35" y="120" width="30" height="4" rx="2" fill="#2dd4a8" transform="rotate(-8, 35, 122)"/>
  <text x="73" y="124" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#555555" letter-spacing="4">marketing strategist</text>
</svg>