<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SCANDISK · v8</title>
  <!-- v8 (Thresh sprint, 2026-09-18). Learning line: "Does wipe-out-only Go with a flipper stone end in a few minutes, and do I want another board?" -->
  <style>
    html, body { margin: 0; height: 100%; background: #080810; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #080810; }
    /* Standing rule: every version shows the buttons on screen. */
    #controls {
      font: 14px/1.6 ui-monospace, Consolas, monospace; color: #9098b8;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; padding: 0 12px; max-width: 100vw;
    }
    #controls b { color: #e8f0f8; background: #282838; padding: 1px 7px; border-radius: 3px; }
    /* Standing rule: every test build has a How to play manual. */
    /* How to play: small and quiet, there when needed (Chris). The pad's MANUAL button opens it too. */
    #howto { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 5;
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      font: bold 14px ui-monospace, Consolas, monospace; color: #606880; border: 1px solid #282838;
      background: transparent; text-decoration: none; opacity: .7; }
    #howto:hover, #howto:focus-visible { color: #d8e0f0; border-color: #606880; opacity: 1; }
    /* ?demo=<scene>: only the screen, for the manual's screenshots. */
    body.shot { justify-content: center; }
    body.shot #controls, body.shot #howto, body.shot #pad { display: none; }
    /* The pad: a Game Boy style controller under the screen, on PC and phone alike (Chris: "the controller on PC
       as a guide"). Keys light up the same buttons, so phone and PC testing match. Standing rule 8. */
    #controls { display: none; }
    #pad { display: grid; width: min(100vw, 420px); padding: 0 16px 10px; box-sizing: border-box;
      grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 10px 0; touch-action: none; user-select: none; -webkit-user-select: none; }
    .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); }
    .ab { display: flex; gap: 14px; justify-content: flex-end; align-items: center; }
    .sys { grid-column: 1 / -1; display: flex; gap: 18px; justify-content: center; }
    #pad button { font: bold 13px ui-monospace, Consolas, monospace; color: #e8f0f8; background: #282838; border: 0;
      touch-action: none; -webkit-tap-highlight-color: transparent; padding: 0; }
    #pad button.on { background: #484868; }
    /* v8: the Z button wears a blue ring while your flipper is ready (the same as the chip on screen). */
    #pad .ab button.ready { box-shadow: inset 0 0 0 3px #3878f8; }
    .dpad button { border-radius: 6px; }
    .ab button { width: 62px; height: 62px; border-radius: 50%; font-size: 15px; }
    #pad .ab .a { background: #1840a0; margin-top: -26px; }
    #pad .ab .a.on { background: #3878f8; }
    .ab label, .sys small { display: block; font: 10px ui-monospace, Consolas, monospace; color: #606880; text-align: center; margin-top: 4px; }
    .key { font-size: 10px; color: #606880; }
    .sys button { width: 86px; height: 30px; border-radius: 15px; font-size: 11px; color: #9098b8; }
    @media (max-width: 640px), (pointer: coarse) {
      html, body { height: 100%; }
      body { justify-content: space-between; gap: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) 0 calc(14px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
      #pad { width: 100%; max-width: 480px; padding: 0 18px; align-items: center; gap: 14px 0; }
      .dpad { grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); }
      .dpad button { font-size: 18px; }
      .ab { gap: 18px; }
      .ab button { width: 78px; height: 78px; font-size: 18px; }
      #pad .ab .a { margin-top: -34px; }
      .sys button { width: 96px; height: 34px; }
      /* The screen sits in a Game Boy style bezel (rounded bottom-right corner). */
      canvas { padding: 8px; background: #141420; border-radius: 8px 8px 28px 8px; box-sizing: content-box; }
      #howto { display: none; } /* phone: the pad has MANUAL; the "?" covered the score */
    }
  </style>

<body>
  <canvas id="screen" width="160" height="144" aria-label="SCANDISK v8"></canvas>
  <div id="controls" aria-label="Controls">
    <span><b>← ↑ → ↓</b> move</span>
    <span><b>X</b> place · pick the tower · flip</span>
    <span><b>Z</b> flipper on/off · <b>Z</b> <b>Z</b> pass</span>
    <span><b>Enter</b> new board</span>
    <span><b>Backspace</b> how to play (manual)</span>
  </div>
  <div id="pad" aria-label="Touch buttons">
    <div class="dpad">
      <span></span><button data-b="up" aria-label="Up">▲</button><span></span>
      <button data-b="left" aria-label="Left">◀</button><span></span><button data-b="right" aria-label="Right">▶</button>
      <span></span><button data-b="down" aria-label="Down">▼</button><span></span>
    </div>
    <div class="ab">
      <div><button data-b="b" aria-label="B (Z): flipper / pass">Z</button><label id="zlabel">FLIPPER</label></div>
      <div><button class="a" data-b="a" aria-label="A (X)">X</button><label>PLACE</label></div>
    </div>
    <div class="sys">
      <div><button data-b="select" aria-label="Select (manual)">MANUAL</button><small>BACKSPACE</small></div>
      <div><button data-b="start" aria-label="Start (new board)">START</button><small>ENTER</small></div>
    </div>
  </div>
  <a id="howto" href="v8-manual.html" target="scandisk-manual" title="How to play (Backspace)" aria-label="How to play">?</a>
</body>
</html>
