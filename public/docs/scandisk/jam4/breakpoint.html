<style>
/* Locked GBC look (VISION 14, BRIEF §10): 160x144 canvas, palette only, dim dotted tiles, crosshair cursor. */
html,body{margin:0;height:100%;background:#080810;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 0 calc(10px + env(safe-area-inset-bottom,0px));box-sizing:border-box;touch-action:manipulation;user-select:none;-webkit-user-select:none;font:12px ui-monospace,Consolas,monospace;color:#9098b8}

/* The Game Boy pad (pattern from jam2-a.html); keys light the same buttons. */
#pad{display:grid;width:min(100vw,420px);padding:0 16px 4px;box-sizing:border-box;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:8px 0;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
.ab{display:flex;gap:12px;justify-content:flex-end;align-items:center}

#pad button{font:bold 13px ui-monospace,Consolas,monospace;color:#e8f0f8;background:#282838;border:0;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
#pad button.on{background:#484868}
.dpad button{border-radius:6px}
.ab button{width:58px;height:58px;border-radius:50%;font-size:15px}
#pad .ab .a{background:#1840a0;margin-top:-24px}
#pad .ab .a.on{background:#3878f8}
.ab label,.sys small{display:block;font:10px ui-monospace,Consolas,monospace;color:#606880;text-align:center;margin-top:4px}
.sys button{width:84px;height:30px;border-radius:15px;font-size:11px;color:#9098b8}
@media (max-width:640px),(pointer:coarse){
  #pad{width:100%;max-width:480px;padding:0 14px;align-items:center;gap:8px 0}
  .dpad{grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px)}
  .dpad button{font-size:18px}
  .ab{gap:14px}
  .ab button{width:70px;height:70px;font-size:16px}
  #pad .ab .a{margin-top:-32px}
  .sys button{width:100px;height:34px}
}

<body>
<canvas id="screen" width="160" height="144" aria-label="BREAKPOINT, jam 4 team 3 sketch"></canvas>
<div id="pad" aria-label="Touch buttons">
  <div class="dpad">
    <span></span><button data-b="up" aria-label="Up: move cursor up">▲</button><span></span>
    <button data-b="left" aria-label="Left: move cursor left">◀</button><span></span><button data-b="right" aria-label="Right: move cursor right">▶</button>
    <span></span><button data-b="down" aria-label="Down: move cursor down">▼</button><span></span>
  </div>
  <div class="ab">
    <div><button data-b="b" aria-label="B (Z): fire all breakpoints">B</button><label id="labB">FIRE ALL</label></div>
    <div><button class="a" data-b="a" aria-label="A (X): arm, or fire if on a breakpoint">A</button><label id="labA">ARM</label></div>
  </div>
  <div class="sys">
    <div><button data-b="select" aria-label="Select: how to play">SELECT</button><small>HOW TO</small></div>
    <div><button data-b="start" aria-label="Start: rescan">START</button><small>RESCAN</small></div>
  </div>
</div>

<script id="core">
// ---- BREAKPOINT core: pure functions, no DOM. Also driven by the check script in node. ----
var BP = (function(){
  var W=6, H=8, BUS=3, SPACING=3; // drive = rows 3..7. FAILED when any column is burned up to the bus (a hole through the drive).
  // shapes: [dr,dc] with dr 0 = top row. Whole packet enters rows 0-1 at once.
  var SHAPES = {
    I2:[[0,0],[1,0]],            // vertical pair
    H2:[[0,0],[0,1]],            // horizontal pair
    G2:[[0,0],[0,2]],            // pair with a gap
    D2:[[0,0],[1,1]],            // diagonal
    I3:[[0,0],[0,1],[0,2]],      // bar
    L3:[[0,0],[1,0],[1,1]],      // corner
    T3:[[0,1],[1,0],[1,1]]       // hook
  };
  // Blow's authored opening: six packets, [shape, column]. One idea each: floor, column, two-at-once, gap, wide, corner.
  var OPENING = [["I2",2],["H2",1],["I3",3],["G2",0],["L3",4],["T3",1]];

  function newState(){
    return {turn:0, cells:[], bad:{}, armed:{}, queue:OPENING.slice(), spent:0, caught:0, over:null, log:[]};
  }
  function clone(s){
    return {turn:s.turn, cells:s.cells.map(function(c){return {r:c.r,c:c.c,p:c.p};}),
      bad:Object.assign({},s.bad), armed:Object.assign({},s.armed), queue:s.queue.slice(),
      spent:s.spent, caught:s.caught, over:s.over, log:[]};
  }
  function k(r,c){return r+","+c;}
  function corrAt(s,r,c){for(var i=0;i<s.cells.length;i++){if(s.cells[i].r===r&&s.cells[i].c===c)return s.cells[i];}return null;}
  function canArm(s,r,c){return !s.over && r>=BUS && r<H && c>=0 && c<W && !s.bad[k(r,c)] && !s.armed[k(r,c)] && !corrAt(s,r,c);}
  function badCount(s){return Object.keys(s.bad).length;}
  function armedList(s){return Object.keys(s.armed).map(function(x){var a=x.split(",");return {r:+a[0],c:+a[1]};});}

  function spawn(s){
    if(s.queue.length===0) return;
    var p=s.queue.shift(), sh=SHAPES[p[0]], col=p[1], id=s.turn;
    for(var i=0;i<sh.length;i++) s.cells.push({r:sh[i][0], c:col+sh[i][1], p:id});
    s.log.push({t:s.turn, ev:"spawn", shape:p[0]});
  }
  // advance: bottom-most first, so every missed cell burns exactly one sector.
  function advance(s){
    s.cells.sort(function(a,b){return b.r-a.r;});
    var keep=[], burned=[];
    for(var i=0;i<s.cells.length;i++){
      var c=s.cells[i], nr=c.r+1;
      if(nr>=H || s.bad[k(nr,c.c)]){ s.bad[k(c.r,c.c)]=1; delete s.armed[k(c.r,c.c)]; burned.push([c.r,c.c]); }
      else { c.r=nr; keep.push(c); }
    }
    s.cells=keep;
    if(burned.length) s.log.push({t:s.turn, ev:"burn", n:burned.length, at:burned});
  }
  function fire(s){
    var hits=0, arms=armedList(s);
    s.cells=s.cells.filter(function(c){ if(s.armed[k(c.r,c.c)]){hits++;return false;} return true; });
    s.spent+=arms.length; s.caught+=hits; s.armed={};
    s.log.push({t:s.turn, ev:"fire", hits:hits, spent:arms.length});
    return hits;
  }
  function endCheck(s){
    var hole=false; for(var c=0;c<W;c++) if(s.bad[k(BUS,c)]) hole=true;
    if(hole) s.over="FAILED";
    else if(s.queue.length===0 && s.cells.length===0) s.over="CLEAN";
  }
  function endTurn(s){
    s.turn++;
    advance(s);
    if(s.turn%SPACING===0) spawn(s);
    endCheck(s);
  }
  // The one action (A at the cursor). Returns {kind, hits} or null for an illegal press (turn does not pass).
  function tap(s,r,c){
    if(s.over) return null;
    var res;
    if(s.armed[k(r,c)]) res={kind:"fire", hits:fire(s)};
    else if(canArm(s,r,c)){ s.armed[k(r,c)]=1; res={kind:"arm"}; }
    else return null;
    endTurn(s);
    return res;
  }
  // B: fire all from anywhere. Same rule as tapping a breakpoint; illegal (no turn) when nothing is armed.
  function fireAll(s){
    if(s.over || armedList(s).length===0) return null;
    var res={kind:"fire", hits:fire(s)};
    endTurn(s);
    return res;
  }
  function start(){ var s=newState(); spawn(s); return s; }

  // ---- bots (for the check; the sketch itself never runs them) ----
  // Naive: "wait, arm, fire per packet". Looks only at the front (lowest) packet.
  function naive(s){
    for(var i=0;i<s.cells.length;i++){ var c=s.cells[i]; if(s.armed[k(c.r,c.c)]) return [c.r,c.c]; }
    if(s.cells.length===0){ for(var r=BUS;r<H;r++)for(var cc=0;cc<W;cc++) if(canArm(s,r,cc)) return [r,cc]; return null; }
    var low=-1, pid=null; s.cells.forEach(function(c){ if(c.r>low){low=c.r;pid=c.p;} });
    var front=s.cells.filter(function(c){return c.p===pid;}).sort(function(a,b){return b.r-a.r;});
    for(i=0;i<front.length;i++){ if(canArm(s,front[i].r+1,front[i].c)) return [front[i].r+1,front[i].c]; }
    for(i=0;i<front.length;i++){ for(r=BUS;r<H;r++) if(canArm(s,r,front[i].c)) return [r,front[i].c]; }
    for(r=BUS;r<H;r++)for(cc=0;cc<W;cc++) if(canArm(s,r,cc)) return [r,cc];
    return null;
  }
  function candidates(s){
    var out=[], arms=armedList(s); if(arms.length) out.push([arms[0].r,arms[0].c]);
    var cols={}; s.cells.forEach(function(c){cols[c.c]=1;});
    for(var cc=0;cc<W;cc++) if(cols[cc]) for(var r=BUS;r<H;r++) if(canArm(s,r,cc)) out.push([r,cc]);
    if(!out.length) for(r=BUS;r<H;r++)for(cc=0;cc<W;cc++) if(canArm(s,r,cc)){out.push([r,cc]);break;}
    return out;
  }
  function score(s){ var v=badCount(s)*100 + s.spent*0.2; if(s.over==="FAILED") v+=10000; return v; }
  function search(s,depth){
    if(depth===0||s.over) return score(s);
    var best=Infinity, cs=candidates(s);
    for(var i=0;i<cs.length;i++){ var t=clone(s); tap(t,cs[i][0],cs[i][1]); var v=search(t,depth-1); if(v<best)best=v; }
    return best;
  }
  function planner(s,depth){
    var best=null, bv=Infinity, cs=candidates(s);
    for(var i=0;i<cs.length;i++){ var t=clone(s); tap(t,cs[i][0],cs[i][1]); var v=search(t,depth-1); if(v<bv){bv=v;best=cs[i];} }
    return best;
  }
  function run(bot,depth){
    var s=start(), guard=0;
    while(!s.over && guard++<200){ var m=bot(s,depth); if(!m) break; tap(s,m[0],m[1]); }
    return s;
  }
  return {W:W,H:H,BUS:BUS,SPACING:SPACING,SHAPES:SHAPES,OPENING:OPENING,start:start,tap:tap,fireAll:fireAll,canArm:canArm,corrAt:corrAt,badCount:badCount,naive:naive,planner:planner,run:run,clone:clone};
})();
if(typeof module!=="undefined") module.exports=BP;
</script>

<script>
(function(){
  var S=null, cur={r:5,c:2}, showHelp=false;
  var C=document.getElementById("screen"), X=C.getContext("2d");
  var labA=document.getElementById("labA");

  // ---- locked palette (BRIEF §10 / VISION 14). Blue = you, red = the virus (VISION 12). ----
  var P={ground:"#080810",panel:"#101018",panel2:"#181828",trace:"#383848",dim:"#202030",white:"#e8f0f8",
         blue:"#3878f8",blue2:"#1840a0",blue3:"#88b0ff",red:"#f03828",red2:"#901808",orange:"#f89020",yellow:"#f0d040",green:"#40d080",purple:"#a060f0"};

  // ---- 3x5 pixel font (copied from src/font.ts) ----
  var G={A:["010","101","111","101","101"],B:["110","101","110","101","110"],C:["011","100","100","100","011"],D:["110","101","101","101","110"],
    E:["111","100","110","100","111"],F:["111","100","110","100","100"],G:["011","100","101","101","011"],H:["101","101","111","101","101"],
    I:["111","010","010","010","111"],J:["001","001","001","101","010"],K:["101","101","110","101","101"],L:["100","100","100","100","111"],
    M:["101","111","111","101","101"],N:["110","101","101","101","101"],O:["010","101","101","101","010"],P:["110","101","110","100","100"],
    Q:["010","101","101","110","011"],R:["110","101","110","101","101"],S:["011","100","010","001","110"],T:["111","010","010","010","010"],
    U:["101","101","101","101","111"],V:["101","101","101","101","010"],W:["101","101","111","111","101"],X:["101","101","010","101","101"],
    Y:["101","101","010","010","010"],Z:["111","001","010","100","111"],
    "0":["111","101","101","101","111"],"1":["010","110","010","010","111"],"2":["111","001","111","100","111"],"3":["111","001","011","001","111"],
    "4":["101","101","111","001","001"],"5":["111","100","111","001","111"],"6":["111","100","111","101","111"],"7":["111","001","010","010","010"],
    "8":["111","101","111","101","111"],"9":["111","101","111","001","111"]," ":["000","000","000","000","000"],".":["000","000","000","000","010"],
    ",":["000","000","000","010","100"],":":["000","010","000","010","000"],"+":["000","010","111","010","000"],"-":["000","000","111","000","000"],
    "=":["000","111","000","111","000"],"!":["010","010","010","000","010"],"<":["001","010","100","010","001"],">":["100","010","001","010","100"],
    "(":["010","100","100","100","010"],")":["010","001","001","001","010"],"'":["010","010","000","000","000"],"?":["111","001","011","000","010"],
    "/":["001","001","010","100","100"],"%":["101","001","010","100","101"]};
  function px(x,y,w,h,col){ X.fillStyle=col; X.fillRect(x,y,w,h); }
  function text(s,x,y,col,k){ k=k||1; s=String(s).toUpperCase(); var cx=x;
    for(var i=0;i<s.length;i++){ var g=G[s[i]]||G["?"]; for(var r=0;r<5;r++)for(var c=0;c<3;c++) if(g[r][c]==="1") px(cx+c*k,y+r*k,k,k,col); cx+=4*k; } }
  function tw(s,k){ return String(s).length*4*(k||1)-(k||1); }
  function wrap(s,n){ var out=[],line=""; s.split(" ").forEach(function(w){ if(line.length+w.length+(line?1:0)>n){out.push(line);line=w;} else line=line?line+" "+w:w; }); if(line)out.push(line); return out; }

  // ---- drawing: board 6x8 at 16px = 96x128, x 32..127, y 8..135. Side columns: NEXT (left), QUEUE (right). ----
  var BX=32, BY=8, CS=16;
  function block(x,y,dark,light){ px(x+1,y+1,14,14,dark); px(x+2,y+2,11,11,light); px(x+3,y+3,3,1,P.white); px(x+3,y+4,1,2,P.white); } // 8x8-style lit block, two shades + inner highlight
  function draw(){
    px(0,0,160,144,P.ground);
    text("BREAKPOINT",BX,1,P.white); text("PUZZLE",131,1,P.trace);
    // side panels
    px(0,BY,30,128,P.panel); px(130,BY,30,128,P.panel);
    text("NEXT",3,12,P.trace);
    var nx=S.queue[0], on={};
    if(nx) BP.SHAPES[nx[0]].forEach(function(d){ on[d[0]*3+d[1]]=1; });
    for(var r=0;r<2;r++)for(var c=0;c<3;c++){ var x=4+c*8, y=20+r*8; if(on[r*3+c]){ px(x,y,7,7,P.red2); px(x+1,y+1,5,5,P.red); } else px(x+3,y+3,1,1,P.dim); }
    var until=BP.SPACING-(S.turn%BP.SPACING);
    if(nx){ text("IN",3,40,P.trace); text(until,15,40,P.white); } else text("NONE",3,40,P.trace);
    text("QUEUE",133,12,P.trace); text(S.queue.length,134,20,P.white,2);
    // crosshair under the tiles
    if(!S.over){ px(BX,BY+cur.r*CS+7,96,2,P.dim); px(BX+cur.c*CS+7,BY,2,128,P.dim); }
    // tiles
    for(r=0;r<BP.H;r++)for(c=0;c<BP.W;c++){
      x=BX+c*CS; y=BY+r*CS; var key=r+","+c;
      if(S.bad[key]){ px(x+1,y+1,14,14,P.dim); for(var i=0;i<14;i++){ px(x+1+i,y+1+i,1,1,P.red2); px(x+14-i,y+1+i,1,1,P.red2); } }
      else if(!(cur.r===r&&cur.c===c&&!S.over)) px(x+7,y+7,2,2,r>=BP.BUS?P.trace:P.dim);
      if(BP.corrAt(S,r,c)) block(x,y,P.red2,P.red);
      if(S.armed[key]){ if(BP.corrAt(S,r,c)) px(x+3,y+3,10,10,P.ground); px(x+4,y+4,8,8,P.blue2); px(x+5,y+5,6,6,P.blue); px(x+5,y+5,2,1,P.blue3); }
    }
    // fail line: thin dim red between bus and drive
    px(BX,BY+BP.BUS*CS-1,96,1,P.red2);
    // cursor corners
    if(!S.over){ x=BX+cur.c*CS; y=BY+cur.r*CS; var w=P.white;
      px(x,y,4,1,w);px(x,y,1,4,w); px(x+12,y,4,1,w);px(x+15,y,1,4,w); px(x,y+15,4,1,w);px(x,y+12,1,4,w); px(x+12,y+15,4,1,w);px(x+15,y+12,1,4,w); }
    text("SELECT=HOW TO",BX,137,P.trace);
    if(S.over){
      var bad=BP.badCount(S), title=S.over==="FAILED"?"DRIVE FAILED":(bad===0?"DRIVE CLEAN":"SCAN DONE "+bad+" BAD");
      px(8,40,144,66,P.ground); px(9,41,142,64,P.panel2);
      text(title,80-tw(title,2)/2,46,S.over==="FAILED"?P.red:P.white,2);
      text("TURNS "+S.turn,16,64,P.white); text("BAD SECTORS "+bad,16,72,P.white); text("BREAKPOINTS SPENT "+S.spent,16,80,P.white);
      text("START=RESCAN",16,94,P.trace);
    }
    if(showHelp){
      px(0,BY,160,128,P.ground); px(1,BY+1,158,126,P.panel);
      var lines=[].concat(wrap("1. CORRUPTION FALLS ONE ROW EVERY A OR B PRESS. THE NEXT PACKET IS SHOWN LEFT. D-PAD MOVES THE CURSOR, FREE.",38),[""],
        wrap("2. A ON AN EMPTY DRIVE CELL: SET A BREAKPOINT (BLUE). A ON A BREAKPOINT, OR B ANYWHERE: FIRE THEM ALL. ALL ARE SPENT, HIT OR MISS.",38),[""],
        wrap("3. CORRUPTION (RED) THAT REACHES THE FLOOR BURNS THAT CELL FOR GOOD. A COLUMN BURNED UP TO THE RED LINE = DRIVE FAILED.",38),[""],["SELECT CLOSES THIS."]);
      for(i=0;i<lines.length;i++) text(lines[i],4,BY+6+i*7,i===lines.length-1?P.trace:P.white);
    }
    labA.textContent=S.armed[cur.r+","+cur.c]?"FIRE ALL":"ARM";
  }
  // integer scale so pixels stay square
  function fit(){ var k=Math.max(1,Math.floor(Math.min((window.innerWidth-16)/160,(window.innerHeight-300)/144))); C.style.width=(160*k)+"px"; C.style.height=(144*k)+"px"; }
  window.addEventListener("resize",fit); fit();

  // ---- sound: PC-speaker style, square wave, all LOW (55-160 Hz). No high pitches, no flashing anywhere. ----
  var AC=null, muted=false;
  function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){AC=null;} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
  function beep(freq,ms,when,type,gain){
    if(muted) return; var a=ac(); if(!a) return;
    // low-pass keeps the square/saw overtones out of the sharp range (ADHD rule: no sharp or high sounds); soft edges avoid clicks
    var o=a.createOscillator(), g=a.createGain(), lp=a.createBiquadFilter(); o.type=type||"square"; o.frequency.value=freq; lp.type="lowpass"; lp.frequency.value=500;
    var t0=a.currentTime+(when||0), t1=t0+ms/1000; g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(gain||0.07,t0+0.005); g.gain.setValueAtTime(gain||0.07,Math.max(t0+0.005,t1-0.008)); g.gain.linearRampToValueAtTime(0.0001,t1);
    o.connect(lp); lp.connect(g); g.connect(a.destination); o.start(t0); o.stop(t1+0.01);
  }
  var SND={
    move:function(){beep(100,15,0,"square",0.03);},
    arm:function(){beep(150,35);},
    fire:function(hits){ beep(80,90,0,"square",0.09); for(var i=0;i<hits;i++) beep(120,30,0.11+i*0.07); },
    burn:function(n){ for(var i=0;i<n;i++) beep(55,220,i*0.12,"sawtooth",0.06); },
    bad:function(){beep(70,50,0,"square",0.04);},
    clean:function(){ beep(110,120); beep(140,120,0.16); beep(160,200,0.32); },
    fail:function(){ beep(90,200); beep(70,200,0.24); beep(55,400,0.48,"sawtooth",0.06); }
  };

  function after(res,before){
    if(!res){ SND.bad(); return; }
    if(res.kind==="arm") SND.arm(); else SND.fire(res.hits);
    var burned=BP.badCount(S)-before; if(burned) SND.burn(burned);
    if(S.over==="CLEAN") SND.clean(); else if(S.over==="FAILED") SND.fail();
  }
  // A: the one action at the cursor (arm, or fire if the cursor is on a breakpoint). One turn.
  function pressA(r,c){ if(!S||S.over) return; var before=BP.badCount(S); after(BP.tap(S,r,c),before); draw(); }
  // B: fire all from anywhere. One turn. Nothing armed = nothing happens, no turn.
  function pressB(){ if(!S||S.over) return; var before=BP.badCount(S); after(BP.fireAll(S),before); draw(); }
  // D-pad: moves the cursor inside the drive. Free (no turn).
  function move(dr,dc){
    if(!S||S.over) return;
    var nr=Math.max(BP.BUS,Math.min(BP.H-1,cur.r+dr)), nc=Math.max(0,Math.min(BP.W-1,cur.c+dc));
    if(nr!==cur.r||nc!==cur.c){ cur.r=nr; cur.c=nc; SND.move(); draw(); }
  }
  function reset(){ S=BP.start(); cur={r:5,c:2}; draw(); }
  function press(b){
    if(!muted) ac();
    if(b==="up") move(-1,0); else if(b==="down") move(1,0); else if(b==="left") move(0,-1); else if(b==="right") move(0,1);
    else if(b==="a") pressA(cur.r,cur.c); else if(b==="b") pressB();
    else if(b==="start") reset(); else if(b==="select"){ showHelp=!showHelp; draw(); }
  }

  // ---- pad: touch/mouse + keyboard light the same buttons ----
  var btns={}; Array.prototype.forEach.call(document.querySelectorAll("#pad button"),function(el){
    btns[el.dataset.b]=el;
    el.addEventListener("pointerdown",function(e){ e.preventDefault(); el.classList.add("on"); press(el.dataset.b); });
    el.addEventListener("pointerup",function(){ el.classList.remove("on"); });
    el.addEventListener("pointercancel",function(){ el.classList.remove("on"); });
    el.addEventListener("pointerleave",function(){ el.classList.remove("on"); });
  });
  var KEYS={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",x:"a",X:"a",z:"b",Z:"b",Enter:"start",Backspace:"select"};
  document.addEventListener("keydown",function(e){ var b=KEYS[e.key]; if(!b) return; e.preventDefault(); if(e.repeat) return; btns[b].classList.add("on"); press(b); });
  document.addEventListener("keyup",function(e){ var b=KEYS[e.key]; if(!b) return; btns[b].classList.remove("on"); });

  // Safety net (Chris got trapped on a how-to once): a tap on the screen closes the how-to, or rescans from the end screen. Overlays never cover the pad.
  C.addEventListener("pointerdown",function(e){ e.preventDefault(); if(showHelp){ showHelp=false; draw(); } else if(S&&S.over) reset(); });

  reset();
  window.BPGame={state:function(){return S;},press:press,reset:reset};
  // Dev/replay hook only: ?taps=r,c;r,c;... plays A-presses at those cells on load (silent), cursor ends on the last one.
  // ?keys=up,a,b,... plays pad presses. Both used for headless screenshots.
  var q=new URLSearchParams(location.search);
  if(q.get("taps")){ muted=true; q.get("taps").split(";").forEach(function(t){ var a=t.split(","); if(a.length===2){ cur={r:+a[0],c:+a[1]}; pressA(+a[0],+a[1]); } }); muted=false; }
  if(q.get("keys")){ muted=true; q.get("keys").split(",").forEach(press); muted=false; }
  if(q.get("howto")){ showHelp=true; draw(); }
})();
</script>
