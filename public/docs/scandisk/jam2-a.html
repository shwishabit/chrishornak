  <!-- Jam 2 TEAM A — turn-based tactics. Learning line: "Does reading the virus one round ahead and shoving it
       into the drive's own holes beat placing stones?" Rules: src/jam2a/rules.ts -->
  <style>
    html, body { margin: 0; height: 100%; background: #080810; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #080810; }
    #howto { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 5;
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;

    #pad { display: grid; width: min(100vw, 420px); padding: 0 16px 10px; box-sizing: border-box;
      grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 10px 0; touch-action: none; user-select: none; -webkit-user-select: none; }

    .sys { grid-column: 1 / -1; display: flex; gap: 18px; justify-content: center; }
    #pad button { font: bold 13px ui-monospace, Consolas, monospace; color: #e8f0f8; background: #282838; border: 0;

    .dpad button { border-radius: 6px; }
    .ab button { width: 58px; height: 58px; border-radius: 50%; font-size: 15px; }
    #pad .ab .a { background: #1840a0; margin-top: -24px; }
    #pad .ab .a.on { background: #3878f8; }

    .sys button { width: 84px; height: 30px; border-radius: 15px; font-size: 11px; color: #9098b8; }
    @media (max-width: 640px), (pointer: coarse) {

      #pad { width: 100%; max-width: 480px; padding: 0 14px; align-items: center; gap: 10px 0; }
      .dpad { grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(3, 62px); }
      .dpad button { font-size: 18px; }
      .ab { gap: 14px; }
      .ab button { width: 70px; height: 70px; font-size: 16px; }
      #pad .ab .a { margin-top: -32px; }
      .sys button { width: 100px; height: 34px; }
      canvas { padding: 4px; margin: 0; background: #141420; border-radius: 8px 8px 28px 8px; box-sizing: content-box; }
      #howto { display: none; }
