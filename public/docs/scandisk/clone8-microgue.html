<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SCANDISK — Clone 8: TICK STEP</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #05050a; color: #e8f0f8;
    font-family: monospace; overflow: hidden; touch-action: manipulation;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 12px;
  }
  #screenWrap {
    border: 3px solid #383848; border-radius: 8px; background: #05050a;
    box-shadow: 0 0 28px rgba(47,109,255,0.15);
  }
  canvas {
    display: block;
    height: min(84vh, 680px); width: calc(min(84vh, 680px) * 180 / 340);
    max-width: 94vw;
    image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer;
  }
  #row { display: flex; gap: 8px; }
  #row button {
    font-family: monospace; font-size: 11px; letter-spacing: .06em;
    background: #14141f; border: 2px solid #383848; color: #e8f0f8;
    border-radius: 14px; padding: 9px 14px; touch-action: manipulation;
  }
  #row button:active { filter: brightness(1.4); }
  #bWait { border-color: #1840a0; }
</style>
</head>
<body>
  <div id="screenWrap"><canvas id="gc" width="180" height="340"></canvas></div>
  <div id="row">
    <button id="bWait">WAIT A TURN</button>
    <button id="bHelp">HOW TO</button>
    <button id="bNew">NEW RUN</button>
  </div>

<script>
// SCANDISK — clone series, clone 8 of 10: TICK STEP (MicRogue's rules).
//
// Chris's locked defining rule: ENEMIES MOVE ONLY WHEN YOU MOVE.
//
// v2, rebuilt 2026-09-22. Chris on v1: "the crawler ends up just following you. It's too simple of
// a rule. Same with the slider. Take another look at the MicRogue enemies. You can copy their
// movement styles." He was right — "steps toward you" is a FOLLOW rule, not a movement style.
//
// What the record actually says (no invention, two sources):
//   1. Jason Pickering, 7DRL devlog: "when I add a new enemy I have a dropdown to select whether
//      its CARDINAL, DIAGONAL, or 8 WAY movement, and also a checkbox for fireproof."
//      → An enemy IS a movement geometry plus a flag. You read it like a chess piece.
//   2. Temple of the Roguelike review: "Some enemies can only attack and move diagonally, where
//      others are just impossible to defeat by your own, and you'll have to drive them into traps."
//      → One enemy you cannot crash. The terrain is your weapon.
//
// The depth that gives us, for free:
//   - A DIAGONAL enemy is parity-locked. It can only ever stand on one colour of the checkerboard.
//     Half the board is permanently safe from it. That is something to READ, not something to flee.
//   - A CARDINAL enemy can never take a diagonal. Standing corner-to-corner is safe from it.
//   - The ARMORED one cannot be crashed at all. You have to walk so its own move drops it in a PIT.
//
// APPROACH (Chris, 2026-09-22): SCANDISK is a phone / web app, not a Game Boy game. Screen is
// phone-portrait and controls are touch (VISION #11, updated). The LOOK is untouched (VISION #14).

const PAL = {
  ground: "#05050a", trace: "#383848", white: "#e8f0f8",
  blue: "#2f6dff", blueDk: "#1840a0",
  red: "#ff2a2a", redDk: "#901808",
  orange: "#ff9500", green: "#39ff6a",
};

const FONT = {
  A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",
  F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",
  K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",
  P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",
  U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",
  Z:"111001010100111",
  "0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001011001111","4":"101101111001001",
  "5":"111100111001111","6":"111100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001111",
  " ":"000000000000000","!":"010010010000010","?":"111001011000010","-":"000000111000000","+":"000010111010000",
  "/":"001001010100100",".":"000000000000010",
  "=":"000111000111000",":":"000010000010000",
};

const cvs = document.getElementById("gc");
const ctx = cvs.getContext("2d");
ctx.imageSmoothingEnabled = false;

function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function box(x,y,w,h,c){ px(x,y,w,1,c); px(x,y+h-1,w,1,c); px(x,y,1,h,c); px(x+w-1,y,1,h,c); }
function glow(c,blur,fn){ ctx.save(); ctx.shadowColor=c; ctx.shadowBlur=blur; fn(); ctx.restore(); }
function textW(s,k){ k=k||1; return Math.max(0, (String(s).length*4-1)*k); }
function text(s,x,y,c,k){
  k = k || 1;
  const u = String(s).toUpperCase();
  for (let i=0;i<u.length;i++){
    const gl = FONT[u[i]]; if (gl===undefined) continue;
    for (let b=0;b<15;b++) if (gl[b]==="1") px(x+(i*4+(b%3))*k, y+Math.floor(b/3)*k, k, k, c);
  }
}
function textC(s,y,c,k){ text(s, Math.floor((180 - textW(s,k))/2), y, c, k); }

// ─── board ───
const N = 6, CELL = 28, GX = 6, GY = 64;
const cellXY = (c,r) => ({ x: GX + c*CELL, y: GY + r*CELL });
const inB = (c,r) => c>=0 && c<N && r>=0 && r<N;

const CARD = [[0,-1],[1,0],[0,1],[-1,0]];
const DIAG = [[-1,-1],[1,-1],[1,1],[-1,1]];
const WAY8 = [...CARD, ...DIAG];

// An enemy is a movement geometry plus a flag. That is the whole definition. (Pickering's dropdown.)
const TYPES = {
  P: { name: "PULSE",  note: "CARDINAL ONLY", dirs: CARD, armored: false },
  X: { name: "SPIKE",  note: "DIAGONAL ONLY", dirs: DIAG, armored: false },
  H: { name: "HUNTER", note: "8 WAY",         dirs: WAY8, armored: false },
  D: { name: "DAEMON", note: "8 WAY NO CRASH",dirs: WAY8, armored: true  },
};
const ORDER = ["P","X","H","D"];

let walls, pits, enemies, you, exitAt, hp, floor, log, phase, showHelp, peek, flash;
const MAX_FLOOR = 5, MAX_HP = 3;

function enemyAt(c,r){ return enemies.find(e => e.c===c && e.r===r); }
function isWall(c,r){ return walls.some(w => w.c===c && w.r===r); }
function isPit(c,r){ return pits.some(p => p.c===c && p.r===r); }
// Enemies may walk into a pit — that is how you kill the armored one. You may not.
function blockedForEnemy(c,r){ return !inB(c,r) || isWall(c,r); }
function blockedForYou(c,r){ return !inB(c,r) || isWall(c,r) || isPit(c,r); }

function reachable(from, to){
  const seen = new Set([from.c+","+from.r]);
  const q = [from];
  while (q.length){
    const n = q.shift();
    if (n.c===to.c && n.r===to.r) return true;
    for (const [dc,dr] of CARD){
      const c=n.c+dc, r=n.r+dr, k=c+","+r;
      if (!blockedForYou(c,r) && !seen.has(k)){ seen.add(k); q.push({c,r}); }
    }
  }
  return false;
}

let genGuard = 0;
function genFloor(){
  let tries = 0;
  do {
    tries++;
    walls = []; pits = [];
    you = { c: 0, r: N-1 };
    exitAt = { c: N-1, r: 0 };
    const taken = (c,r) => (c===you.c&&r===you.r) || (c===exitAt.c&&r===exitAt.r)
                        || walls.some(w=>w.c===c&&w.r===r) || pits.some(p=>p.c===c&&p.r===r);
    for (let i=0;i<2+Math.min(2,floor);i++){
      let c,r,g=0; do { c=Math.floor(Math.random()*N); r=Math.floor(Math.random()*N); g++; } while (g<200 && taken(c,r));
      walls.push({c,r});
    }
    // Pits are the weapon, so there are always enough of them to use.
    for (let i=0;i<2+Math.floor(floor/2);i++){
      let c,r,g=0; do { c=Math.floor(Math.random()*N); r=Math.floor(Math.random()*N); g++; } while (g<200 && taken(c,r));
      pits.push({c,r});
    }
  } while (!reachable(you, exitAt) && tries < 80);

  // The mix teaches one geometry at a time, then combines them.
  const mix = [["P"], ["P","X"], ["X","H"], ["P","X","H"], ["X","H","D"]][floor-1] || ["P"];
  enemies = [];
  for (const t of mix){
    let c,r,g=0;
    do {
      c=Math.floor(Math.random()*N); r=Math.floor(Math.random()*N); g++;
    } while (g<300 && (isWall(c,r) || isPit(c,r) || enemyAt(c,r)
             || (Math.abs(c-you.c)+Math.abs(r-you.r)) < 3
             || (c===exitAt.c && r===exitAt.r)));
    enemies.push({ c, r, t });
  }
  // A floor must be winnable the moment it opens, with armored viruses counted as walls.
  if (!youHaveAStep() || !youCanReachExit()){ if (genGuard++ < 40) return genFloor(); }
}

function newRun(){
  genGuard = 0;
  hp = MAX_HP; floor = 1; phase = "play"; showHelp = false; peek = null; flash = 0;
  log = "FLOOR 1 - REACH THE EXIT";
  genFloor();
}

// ─── movement: geometry, not pursuit ───
function enemyTargets(e){
  // Every cell this piece could legally end on. Pits are included — it will walk in and die.
  const out = [];
  for (const [dc,dr] of TYPES[e.t].dirs){
    const c=e.c+dc, r=e.r+dr;
    if (blockedForEnemy(c,r)) continue;
    const other = enemyAt(c,r);
    if (other && other !== e) continue;
    out.push({c,r});
  }
  return out;
}

// You cannot crash an ARMORED virus, so to you it is a wall that walks. That makes it the one piece
// on the board that can seal you in — measured: 71 unwinnable floor-5 boards in 12,556 turns, which
// is what Chris hit ("a level started with me trapped. There was no way to win"). VISION's fair-enemy
// line is "every loss makes sense from the screen", and being walled in explains nothing. So an
// armored virus is forbidden from making the move that closes the last door.
function passableForYou(c,r){
  if (blockedForYou(c,r)) return false;
  const e = enemyAt(c,r);
  return !(e && TYPES[e.t].armored);
}
function youHaveAStep(){
  return CARD.some(([dc,dr]) => passableForYou(you.c+dc, you.r+dr));
}
function youCanReachExit(){
  const seen = new Set([you.c+","+you.r]); const q = [{c:you.c, r:you.r}];
  while (q.length){
    const n = q.shift();
    if (n.c===exitAt.c && n.r===exitAt.r) return true;
    for (const [dc,dr] of CARD){
      const c=n.c+dc, r=n.r+dr, k=c+","+r;
      if (passableForYou(c,r) && !seen.has(k)){ seen.add(k); q.push({c,r}); }
    }
  }
  return false;
}
function wouldSealYouIn(e, to){
  const oc = e.c, or_ = e.r;
  e.c = to.c; e.r = to.r;
  const bad = !youHaveAStep() || !youCanReachExit();
  e.c = oc; e.r = or_;
  return bad;
}

function moveEnemy(e){
  const opts = enemyTargets(e);
  if (!opts.length) return;
  const here = Math.max(Math.abs(e.c-you.c), Math.abs(e.r-you.r));
  let best = null, bestD = Infinity;
  for (const o of opts){
    if (o.c===you.c && o.r===you.r) return hit(e);      // it reaches you: that is its attack
    const d = Math.max(Math.abs(o.c-you.c), Math.abs(o.r-you.r));
    if (d < bestD){ bestD = d; best = o; }
  }
  // It closes when it can. When it cannot — a SPIKE on the wrong square colour never can — it
  // still shuffles inside its own geometry rather than freezing into a statue. A diagonal move
  // always keeps its parity, so shuffling never lets it cheat its way onto your colour.
  if (!best) return;
  if (bestD >= here){
    const side = opts.filter(o => Math.max(Math.abs(o.c-you.c), Math.abs(o.r-you.r)) <= here);
    if (!side.length) return;
    best = side[Math.floor(Math.random()*side.length)];
  }
  if (TYPES[e.t].armored && wouldSealYouIn(e, best)) return;   // it holds rather than wall you in
  e.c = best.c; e.r = best.r;
  if (isPit(e.c, e.r)){
    log = TYPES[e.t].name + " FELL IN A PIT";
    enemies.splice(enemies.indexOf(e), 1);
  }
}

function hit(e){
  hp--; flash = 14;
  log = TYPES[e.t].name + " HIT YOU";
  if (hp <= 0){ phase = "dead"; log = "YOUR RUN ENDS HERE"; }
}

function tick(){
  if (phase !== "play") return;
  for (const e of [...enemies]){
    if (phase !== "play") break;
    if (enemies.includes(e)) moveEnemy(e);
  }
  peek = null;
}

function tryMove(c, r){
  if (phase !== "play" || showHelp) return;
  const dist = Math.abs(c - you.c) + Math.abs(r - you.r);

  if (dist === 0){ log = "YOU HOLD STILL"; tick(); return; }   // waiting is a real move
  if (dist !== 1){
    const e = enemyAt(c,r);
    peek = (peek && peek.c===c && peek.r===r) ? null : (e ? { c, r } : null);
    if (peek) log = TYPES[e.t].name + ": " + TYPES[e.t].note;
    return;
  }
  if (isPit(c,r)){ log = "THAT IS A PIT - DRIVE THEM IN"; return; }
  if (isWall(c,r)){ log = "A BLOCK IS IN THE WAY"; return; }

  const e = enemyAt(c,r);
  if (e){
    if (TYPES[e.t].armored){ log = "THE DAEMON WILL NOT CRASH"; return; }
    log = "YOU CRASH THE " + TYPES[e.t].name;
    enemies.splice(enemies.indexOf(e), 1);
    you.c = c; you.r = r;
    tick();
    return;
  }

  you.c = c; you.r = r;
  if (c === exitAt.c && r === exitAt.r){
    if (floor >= MAX_FLOOR){ phase = "won"; log = "DISK CLEAN"; return; }
    floor++; log = "FLOOR " + floor;
    genFloor();
    return;
  }
  log = "";
  tick();
}

document.getElementById("bWait").addEventListener("pointerdown", e => { e.preventDefault(); tryMove(you.c, you.r); });
document.getElementById("bHelp").addEventListener("pointerdown", e => { e.preventDefault(); showHelp = !showHelp; });
document.getElementById("bNew").addEventListener("pointerdown", e => { e.preventDefault(); newRun(); });

cvs.addEventListener("pointerdown", (e) => {
  if (showHelp){ showHelp = false; return; }
  if (phase !== "play"){ newRun(); return; }
  const b = cvs.getBoundingClientRect();
  const mx = (e.clientX - b.left) / b.width  * 180;
  const my = (e.clientY - b.top)  / b.height * 340;
  const c = Math.floor((mx - GX) / CELL), r = Math.floor((my - GY) / CELL);
  if (inB(c,r)) tryMove(c, r);
});

// ─── draw ───
function cellDots(x,y){ px(x+13,y+13,2,2,PAL.trace); }
function pitMark(x,y){
  const c = PAL.orange;
  px(x+4,y+4,6,1,c); px(x+4,y+4,1,6,c);
  px(x+18,y+4,6,1,c); px(x+23,y+4,1,6,c);
  px(x+4,y+23,6,1,c); px(x+4,y+18,1,6,c);
  px(x+18,y+23,6,1,c); px(x+23,y+18,1,6,c);
}
function piece(x,y,col,letter,armored){
  glow(col, 8, () => px(x+5, y+5, 18, 18, col));
  if (armored) box(x+2, y+2, 24, 24, PAL.white);
  if (letter) text(letter, x+13, y+10, PAL.ground, 2);
}

function draw(){
  px(0,0,180,340,PAL.ground);

  for (let i=0;i<MAX_HP;i++){
    if (i < hp) glow(PAL.blue, 6, () => px(8+i*16, 10, 12, 12, PAL.blue));
    else box(8+i*16, 10, 12, 12, PAL.trace);
  }
  const fl = "FLR " + floor + "/" + MAX_FLOOR;
  text(fl, 180 - textW(fl,2) - 8, 11, PAL.white, 2);

  textC(log || "", 34, PAL.orange);
  textC("TAP NEXT DOOR TO STEP - FAR TO READ", 48, PAL.trace);

  let peekCells = [];
  if (peek){
    const e = enemyAt(peek.c, peek.r);
    if (e) peekCells = enemyTargets(e); else peek = null;
  }

  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const { x, y } = cellXY(c,r);
    if (isWall(c,r)){ px(x+3, y+3, 22, 22, PAL.trace); continue; }
    cellDots(x,y);
    if (isPit(c,r)) pitMark(x,y);
    if (peekCells.some(p => p.c===c && p.r===r)) box(x+2, y+2, 24, 24, PAL.orange);
    if (c===exitAt.c && r===exitAt.r){
      glow(PAL.green, 6, () => box(x+3, y+3, 22, 22, PAL.green));
      text("E", x+11, y+10, PAL.green, 2);
    }
  }
  for (const e of enemies){
    const { x, y } = cellXY(e.c, e.r);
    piece(x, y, PAL.red, e.t, TYPES[e.t].armored);
  }
  {
    const { x, y } = cellXY(you.c, you.r);
    piece(x, y, flash > 0 && (flash % 4 < 2) ? PAL.white : PAL.blue, null, false);
    if (flash > 0) flash--;
  }

  // Legend — an enemy IS its movement geometry. Only the ones on this floor.
  let ly = GY + N*CELL + 12;
  text("AN ENEMY IS HOW IT MOVES", 8, ly, PAL.white); ly += 12;
  const live = ORDER.filter(k => enemies.some(e => e.t === k));
  for (const k of (live.length ? live : ORDER)){
    glow(PAL.red, 4, () => px(8, ly-2, 9, 9, PAL.red));
    text(k, 11, ly, PAL.ground);
    text(TYPES[k].name, 22, ly, PAL.white);
    text(TYPES[k].note, 62, ly, PAL.trace);
    ly += 12;
  }
  ly += 2;
  text("PIT = WALK SO THEY STEP IN", 8, ly, PAL.orange); ly += 11;
  text("NOTHING MOVES UNTIL YOU DO", 8, ly, PAL.orange);

  if (phase === "dead" || phase === "won"){
    px(14, 140, 152, 60, PAL.ground);
    box(14, 140, 152, 60, PAL.trace);
    textC(phase === "won" ? "DISK CLEAN" : "YOU ARE WIPED", 156, PAL.white, 2);
    textC(phase === "won" ? "ALL 5 FLOORS" : ("YOU REACHED FLOOR " + floor), 176, PAL.orange);
    textC("TAP TO RUN AGAIN", 188, PAL.trace);
  }

  if (showHelp){
    px(10, 24, 160, 292, PAL.ground);
    box(10, 24, 160, 292, PAL.trace);
    const L = [
      "TICK STEP",
      "",
      "NOTHING MOVES",
      "UNTIL YOU MOVE.",
      "ONE STEP FROM YOU",
      "= ONE FROM THEM.",
      "",
      "EACH ENEMY IS A",
      "SHAPE OF MOVE,",
      "LIKE A CHESS",
      "PIECE:",
      "",
      "PULSE - UP DOWN",
      "LEFT RIGHT ONLY.",
      "SO A CORNER STEP",
      "IS SAFE FROM IT.",
      "",
      "SPIKE - CORNERS",
      "ONLY. IT CAN NEVER",
      "LEAVE ITS OWN",
      "SQUARE COLOUR.",
      "HALF THE BOARD IS",
      "SAFE FROM IT.",
      "",
      "HUNTER - ALL 8.",
      "",
      "DAEMON - ALL 8,",
      "AND YOU CANNOT",
      "CRASH IT. WALK SO",
      "IT STEPS IN A PIT.",
      "",
      "TAP TO CLOSE",
    ];
    L.forEach((l,i) => text(l, 18, 34 + i*9, i===0 ? PAL.blue : PAL.white, i===0 ? 2 : 1));
  }

  requestAnimationFrame(draw);
}

newRun();
draw();
</script>
</body>
</html>
