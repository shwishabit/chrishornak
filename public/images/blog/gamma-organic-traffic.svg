<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="gammaTitle gammaDesc">
  <title id="gammaTitle">Gamma Light Therapy organic traffic, up 500% in six months</title>
  <desc id="gammaDesc">A bar chart indexed to the starting month. Month zero sits at 100. Month six sits at 600, a 500 percent increase in organic traffic.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#143d35"/>
      <stop offset="55%" stop-color="#10322b"/>
      <stop offset="100%" stop-color="#0c2822"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2dd4a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2dd4a8" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.04"/>
  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- Label block -->
  <text x="96" y="126" fill="#2dd4a8" font-family="system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="3.4">GAMMA LIGHT THERAPY</text>
  <text x="96" y="164" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="21">Organic traffic</text>

  <text x="96" y="296" fill="#ffffff" font-family="system-ui, sans-serif" font-size="128" font-weight="800" letter-spacing="-5">+500%</text>
  <text x="96" y="342" fill="#ffffff" fill-opacity="0.62" font-family="system-ui, sans-serif" font-size="25">in six months</text>

  <!-- Baseline rule -->
  <line x1="700" y1="500" x2="1104" y2="500" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>

  <!-- Month 0 bar: indexed at 100 -->
  <rect x="730" y="452" width="118" height="48" rx="6" fill="#ffffff" fill-opacity="0.16"/>
  <text x="789" y="432" text-anchor="middle" fill="#ffffff" fill-opacity="0.62" font-family="system-ui, sans-serif" font-size="23" font-weight="700">100</text>
  <text x="789" y="534" text-anchor="middle" fill="#ffffff" fill-opacity="0.45" font-family="system-ui, sans-serif" font-size="19">Month 0</text>

  <!-- Month 6 bar: indexed at 600 -->
  <rect x="956" y="212" width="118" height="288" rx="6" fill="url(#barFill)"/>
  <text x="1015" y="192" text-anchor="middle" fill="#2dd4a8" font-family="system-ui, sans-serif" font-size="23" font-weight="700">600</text>
  <text x="1015" y="534" text-anchor="middle" fill="#ffffff" fill-opacity="0.45" font-family="system-ui, sans-serif" font-size="19">Month 6</text>

  <!-- Honesty line -->
  <text x="96" y="576" fill="#ffffff" fill-opacity="0.38" font-family="system-ui, sans-serif" font-size="17">Indexed to the starting month. Endpoints only, no monthly data shown.</text>
</svg>
