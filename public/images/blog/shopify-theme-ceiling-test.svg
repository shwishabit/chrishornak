<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="testTitle testDesc">
  <title id="testTitle">The three outcomes of trying to change one thing in your Shopify theme</title>
  <desc id="testDesc">Three outcomes. One: it takes a minute, which means the theme is working for you. Two: you find it but it is not editable, which means a value was written into the code. Three: you cannot find it at all, which means nothing is named. Whichever happens is your ceiling.</desc>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#143d35"/>
      <stop offset="55%" stop-color="#10322b"/>
      <stop offset="100%" stop-color="#0c2822"/>
    </linearGradient>
    <radialGradient id="vig2" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect width="1200" height="630" filter="url(#grain2)" opacity="0.04"/>
  <rect width="1200" height="630" fill="url(#vig2)"/>

  <text x="96" y="112" fill="#2dd4a8" font-family="system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="3.4">THE TEST</text>
  <text x="96" y="166" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Try to change one thing.</text>
  <text x="96" y="206" fill="#ffffff" fill-opacity="0.55" font-family="system-ui, sans-serif" font-size="22">Three things can happen. Each one tells you something different.</text>

  <!-- Card 1 -->
  <rect x="96" y="262" width="320" height="220" rx="14" fill="#2dd4a8" fill-opacity="0.12" stroke="#2dd4a8" stroke-opacity="0.5" stroke-width="1"/>
  <text x="128" y="316" fill="#2dd4a8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">1</text>
  <text x="128" y="362" fill="#ffffff" font-family="system-ui, sans-serif" font-size="23" font-weight="700">It takes a minute.</text>
  <text x="128" y="400" fill="#ffffff" fill-opacity="0.62" font-family="system-ui, sans-serif" font-size="19">The theme is working</text>
  <text x="128" y="426" fill="#ffffff" fill-opacity="0.62" font-family="system-ui, sans-serif" font-size="19">for you. Keep it that way.</text>

  <!-- Card 2 -->
  <rect x="440" y="262" width="320" height="220" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="472" y="316" fill="#ffffff" fill-opacity="0.55" font-family="system-ui, sans-serif" font-size="34" font-weight="800">2</text>
  <text x="472" y="362" fill="#ffffff" font-family="system-ui, sans-serif" font-size="23" font-weight="700">You find it. It won&#8217;t edit.</text>
  <text x="472" y="400" fill="#ffffff" fill-opacity="0.62" font-family="system-ui, sans-serif" font-size="19">The value was written</text>
  <text x="472" y="426" fill="#ffffff" fill-opacity="0.62" font-family="system-ui, sans-serif" font-size="19">into the code.</text>

  <!-- Card 3 -->
  <rect x="784" y="262" width="320" height="220" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="816" y="316" fill="#ffffff" fill-opacity="0.55" font-family="system-ui, sans-serif" font-size="34" font-weight="800">3</text>
  <text x="816" y="362" fill="#ffffff" font-family="system-ui, sans-serif" font-size="23" font-weight="700">You can&#8217;t find it at all.</text>
  <text x="816" y="400" fill="#ffffff" fill-opacity="0.62" font-family="system-ui, sans-serif" font-size="19">Nothing is named, so</text>
  <text x="816" y="426" fill="#ffffff" fill-opacity="0.62" font-family="system-ui, sans-serif" font-size="19">nobody can help quickly.</text>

  <line x1="96" y1="530" x2="1104" y2="530" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
  <text x="96" y="576" fill="#ffffff" fill-opacity="0.72" font-family="system-ui, sans-serif" font-size="21">Whichever one happens is your ceiling for the next year.</text>
</svg>
