<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="shrinkTitle shrinkDesc">
  <title id="shrinkTitle">Text in an image shrinks with the image</title>
  <desc id="shrinkDesc">The same headline at two sizes. On a 1,200 pixel wide desktop image it is set at 24 pixels. On a 390 pixel wide phone screen the whole image scales down and the headline renders at 7.8 pixels.</desc>

  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#143d35"/>
      <stop offset="55%" stop-color="#10322b"/>
      <stop offset="100%" stop-color="#0c2822"/>
    </linearGradient>
    <radialGradient id="vig4" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="grain4">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg4)"/>
  <rect width="1200" height="630" filter="url(#grain4)" opacity="0.04"/>
  <rect width="1200" height="630" fill="url(#vig4)"/>

  <text x="96" y="112" fill="#2dd4a8" font-family="system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="3.4">THE SHRINK</text>
  <text x="96" y="166" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Same image. A third of the size.</text>
  <text x="96" y="206" fill="#ffffff" fill-opacity="0.55" font-family="system-ui, sans-serif" font-size="22">Words inside the picture scale down with it.</text>

  <!-- Desktop: the image at full width (drawn at half scale: 600 = 1,200px) -->
  <text x="96" y="262" fill="#ffffff" fill-opacity="0.45" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2.4">DESKTOP · 1,200PX WIDE</text>
  <rect x="96" y="280" width="600" height="250" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
  <rect x="96" y="280" width="600" height="250" rx="12" fill="#2dd4a8" fill-opacity="0.05"/>
  <text x="128" y="372" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="800">Save 20% this week</text>
  <text x="128" y="408" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="18">Free shipping over $50</text>
  <text x="128" y="500" fill="#2dd4a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">headline: 24px</text>

  <!-- Phone: the same image scaled to 390px (drawn at half scale: 195) -->
  <text x="800" y="262" fill="#ffffff" fill-opacity="0.45" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2.4">PHONE · 390PX WIDE</text>
  <rect x="800" y="280" width="215" height="300" rx="26" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.22"/>
  <rect x="810" y="320" width="195" height="81" rx="6" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
  <rect x="810" y="320" width="195" height="81" rx="6" fill="#2dd4a8" fill-opacity="0.05"/>
  <text x="820" y="350" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9.8" font-weight="800">Save 20% this week</text>
  <text x="820" y="362" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="5.9">Free shipping over $50</text>
  <rect x="810" y="414" width="160" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="810" y="430" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <text x="800" y="616" fill="#f59e6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">headline: 7.8px</text>

  <!-- arrow -->
  <path d="M708 405 L 788 360" stroke="#f59e6b" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
